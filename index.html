    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              cream: '#fff7ed',
              warm: '#fef3c7',
              orange: '#f97316',
              amber: '#f59e0b',
              red: '#ef4444'
            }
          },
          fontFamily: {
            display: ['Caveat', 'cursive'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    * { -webkit-tap-highlight-color: transparent; }

    .glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .glass-dark {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .glass-solid {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-25px) rotate(6deg); }
    }
    @keyframes float-reverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(-6deg); }
    }
    .animate-float { animation: float 7s ease-in-out infinite; }
    .animate-float-reverse { animation: float-reverse 9s ease-in-out infinite; }
    .animate-float-delayed { animation: float 8s ease-in-out 2s infinite; }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .hero-gradient {
      background: linear-gradient(-45deg, #7c2d12, #c2410c, #f59e0b, #dc2626, #991b1b);
      background-size: 400% 400%;
      animation: gradientShift 18s ease infinite;
    }

    @keyframes particle-rise {
      0% { transform: translateY(110vh) rotate(0deg) scale(0.5); opacity: 0; }
      15% { opacity: 0.6; }
      85% { opacity: 0.6; }
      100% { transform: translateY(-20vh) rotate(360deg) scale(1); opacity: 0; }
    }
    .particle {
      position: absolute;
      pointer-events: none;
      animation: particle-rise linear infinite;
    }

    .scroll-reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .scroll-reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .cart-drawer {
      transform: translateX(110%);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cart-drawer.open {
      transform: translateX(0);
    }

    .food-card {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .food-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 30px 60px -15px rgba(249, 115, 22, 0.3);
    }

    .btn-glow {
      position: relative;
      overflow: hidden;
    }
    .btn-glow::after {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(45deg, #f97316, #f59e0b, #ef4444, #f97316);
      border-radius: inherit;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s;
      filter: blur(12px);
    }
    .btn-glow:hover::after { opacity: 0.6; }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.3) translateY(30px); }
      50% { transform: scale(1.05) translateY(-8px); }
      70% { transform: scale(0.95) translateY(4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-bounce-in {
      animation: bounceIn 0.55s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, transparent 25%, rgba(255,255,255,0.4) 50%, transparent 75%);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #fdba74; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #f97316; }

    .location-dropdown::-webkit-scrollbar { width: 4px; }

    @media (max-width: 640px) {
      .cart-drawer { width: 100%; }
    }
  </style>
<base target="_blank">

// ===================== HELPERS =====================
function getDeliveryFee(distance) {
  if (distance <= 3) return 20;
  if (distance <= 7) return 40;
  if (distance <= 12) return 60;
  return null;
}

function getFeeLabel(distance) {
  const fee = getDeliveryFee(distance);
  if (fee === null) return "Unavailable";
  return `₹${fee}`;
}

function SafeImage({ src, alt, className }) {
  const [error, setError] = useState(false);
  if (error || !src) {
    return (
      <div className={`${className} bg-gradient-to-br from-orange-100 via-amber-50 to-yellow-100 flex items-center justify-center`}>
        <div className="text-center px-4">
          <div className="text-5xl mb-2 opacity-60">🍽️</div>
          <div className="text-xs text-orange-400 font-semibold uppercase tracking-wide">{alt}</div>
        </div>
      </div>
    );
  }
  return (
    <img 
      src={src} 
      alt={alt} 
      className={className} 
      onError={() => setError(true)} 
      loading="lazy"
      decoding="async"
    />
  );
}

function Toast({ message, onClose }) {
  useEffect(() => {
    const timer = setTimeout(onClose, 3000);
    return () => clearTimeout(timer);
  }, [onClose]);

  return (
    <div className="bg-gray-900/95 backdrop-blur-md text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 animate-bounce-in border border-white/10">
      <span className="text-green-400 text-xl flex-shrink-0">✓</span>
      <span className="font-medium text-sm">{message}</span>
    </div>
  );
}

function LocationModal({ onClose, onSelect }) {
  const [query, setQuery] = useState('');
  const [suggestions, setSuggestions] = useState([]);
  const [isDetecting, setIsDetecting] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => {
    inputRef.current?.focus();
  }, []);

  useEffect(() => {
    if (query.trim().length > 0) {
      const q = query.toLowerCase();
      const filtered = LOCATION_DB.filter(loc => 
        loc.name.toLowerCase().includes(q)
      ).slice(0, 8);
      setSuggestions(filtered);
    } else {
      setSuggestions([]);
    }
  }, [query]);

  const handleDetect = () => {
    setIsDetecting(true);
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        () => {
          setIsDetecting(false);
          const home = LOCATION_DB.find(l => l.distance === 0);
          if (home) handleSelect(home);
        },
        () => {
          setIsDetecting(false);
          alert('Could not detect location. Please search manually or select from the list.');
        },
        { timeout: 8000 }
      );
    } else {
      setIsDetecting(false);
      alert('Geolocation is not supported by your browser.');
    }
  };

  const handleSelect = (loc) => {
    onSelect(loc);
    onClose();
  };

  const displayList = query.trim().length > 0 ? suggestions : LOCATION_DB.slice(0, 6);

  return (
    <div className="fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose}></div>
      <div className="relative bg-white rounded-t-[2.5rem] sm:rounded-[2.5rem] shadow-2xl w-full max-w-lg overflow-hidden animate-bounce-in">
        <div className="p-6 sm:p-8 border-b border-orange-100">
          <div className="flex items-center justify-between mb-6">
            <div>
              <h3 className="text-2xl font-bold text-gray-800">Set Delivery Location</h3>
              <p className="text-gray-500 text-sm mt-1">We deliver all across Ahmedabad</p>
            </div>
            <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-full transition-colors">
              <svg className="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>

          <button 
            onClick={handleDetect}
            disabled={isDetecting}
            className="w-full flex items-center gap-4 bg-gradient-to-r from-orange-50 to-amber-50 border-2 border-orange-200 rounded-2xl p-4 mb-5 hover:border-orange-400 hover:shadow-md transition-all text-left"
          >
            <div className="w-12 h-12 bg-gradient-to-br from-orange-400 to-red-500 rounded-xl flex items-center justify-center text-white shrink-0 shadow-lg">
              {isDetecting ? (
                <div className="w-6 h-6 border-3 border-white border-t-transparent rounded-full animate-spin"></div>
              ) : (
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
              )}
            </div>
            <div>
              <div className="font-bold text-gray-800">{isDetecting ? 'Detecting your location...' : 'Use Current Location'}</div>
              <div className="text-xs text-gray-500">Enable GPS for instant detection</div>
            </div>
          </button>

          <div className="relative">
            <input
              ref={inputRef}
              type="text"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="Search area, society, landmark..."
              className="w-full pl-12 pr-4 py-4 bg-gray-50 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-100 transition-all text-base font-medium"
            />
            <svg className="absolute left-4 top-1/2 -translate-y-1/2 w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
        </div>

        <div className="max-h-80 overflow-y-auto location-dropdown pb-6">
          {displayList.length > 0 ? (
            <div className="p-3">
              {query.trim().length === 0 && (
                <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 px-3">Popular Areas</div>
              )}
              {displayList.map((loc, idx) => {
                const fee = getDeliveryFee(loc.distance);
                return (
                  <button
                    key={idx}
                    onClick={() => handleSelect(loc)}
                    className="w-full flex items-center gap-4 p-4 hover:bg-orange-50 rounded-2xl transition-all text-left group"
                  >
                    <div className="w-10 h-10 bg-gray-100 group-hover:bg-orange-100 rounded-full flex items-center justify-center text-gray-400 group-hover:text-orange-500 shrink-0 transition-colors">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                      </svg>
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="font-bold text-gray-800 truncate">{loc.name}</div>
                      <div className="text-xs text-gray-500 mt-0.5">{loc.distance} km from kitchen</div>
                    </div>
                    <div className={`text-sm font-bold px-3 py-1.5 rounded-lg ${fee === null ? 'bg-red-50 text-red-500' : 'bg-green-50 text-green-600'}`}>
                      {getFeeLabel(loc.distance)}
                    </div>
                  </button>
                );
              })}
            </div>
          ) : (
            <div className="p-10 text-center text-gray-400">
              <div className="text-5xl mb-3">🔍</div>
              <p className="font-bold text-gray-600 mb-1">No locations found</p>
              <p className="text-sm">Try searching for "Ghuma", "Bopal", or "Vastrapur"</p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

        <div className="text-4xl md:text-5xl font-display text-orange-400 mb-4">"Chatpata Taste, Happy Mood!"</div>
        <p className="text-gray-400 mb-2 text-lg">Homemade with love by Alka ❤️</p>
        <p className="text-gray-600 text-sm mb-8">Near Pleasure Club, Jaldhara 4, Ghuma, Ahmedabad</p>
        <div className="flex justify-center gap-6 mb-8">
          <a href="tel:6351189121" className="text-gray-400 hover:text-white transition-colors text-sm">📞 6351189121</a>
          <a href="https://wa.me/916351189121" target="_blank" rel="noopener noreferrer" className="text-gray-400 hover:text-white transition-colors text-sm">💬 WhatsApp</a>
        </div>
        <div className="text-xs text-gray-600">
          © 2026 Ghuma Ka Chataka Khana. All rights reserved.
        </div>
      </div>
    </footer>
  );
}

function FloatingCheckout({ count, total, onClick }) {
  return (
    <button 
      onClick={onClick}
      className="fixed bottom-6 left-4 right-4 sm:left-auto sm:right-6 sm:w-auto z-40 animate-bounce-in"
    >
      <div className="bg-gradient-to-r from-orange-500 to-red-500 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center justify-between gap-6 hover:scale-[1.03] transition-transform">
        <div className="flex items-center gap-4">
          <div className="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center font-bold text-xl backdrop-blur-sm">
            {count}
          </div>
          <div className="text-left">
            <div className="text-xs opacity-90 font-medium">View Cart</div>
            <div className="font-bold text-2xl">₹{total}</div>
          </div>
        </div>
        <div className="flex items-center gap-2 font-bold text-lg">
          Checkout <span className="text-2xl">→</span>
        </div>
      </div>
    </button>
  );
}

// ===================== APP =====================
function App() {
  const [cart, setCart] = useState([]);
  const [isCartOpen, setIsCartOpen] = useState(false);
  const [location, setLocation] = useState(null);
  const [showLocationModal, setShowLocationModal] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [activeCategory, setActiveCategory] = useState('all');

  useEffect(() => {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -50px 0px' });

    const observeElements = () => {
      document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));
    };

    observeElements();
    const interval = setInterval(observeElements, 1000);

    return () => {
      observer.disconnect();
      clearInterval(interval);
    };
  }, []);

  const addToast = (message) => {
    const id = Date.now() + Math.random();
    setToasts(prev => [...prev, {id, message}]);
    setTimeout(() => {
      setToasts(prev => prev.filter(t => t.id !== id));
    }, 3200);
  };

  const addToCart = (item) => {
    setCart(prev => {
      const existing = prev.find(i => i.id === item.id);
      if (existing) {
        return prev.map(i => i.id === item.id ? {...i, quantity: i.quantity + 1} : i);
      }
      return [...prev, {...item, quantity: 1}];
    });
    addToast(`Added ${item.name} to cart! 🎉`);
  };

  const removeFromCart = (id) => {
    setCart(prev => prev.filter(i => i.id !== id));
    addToast('Item removed from cart');
  };

  const updateQuantity = (id, delta) => {
    setCart(prev => prev.map(i => {
      if (i.id === id) {
        const newQty = Math.max(1, i.quantity + delta);
        return {...i, quantity: newQty};
      }
      return i;
    }));
  };

  const itemTotal = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
  const deliveryFee = location ? getDeliveryFee(location.distance) : 0;
  const grandTotal = itemTotal + (deliveryFee || 0);

  const checkout = () => {
    if (cart.length === 0) {
      addToast('Your cart is empty! 🛒');
      return;
    }
    if (!location) {
      setShowLocationModal(true);
      return;
    }
    if (deliveryFee === null) {
      addToast('Sorry, delivery unavailable in your area 😔');
      return;
    }

    const items = cart.map(item => `• ${item.name} x${item.quantity} = ₹${item.price * item.quantity}`).join('\n');
    const message = `Hi, Im (Name to be filled manually), my exact home address is (address to be filled manually), i would like:\n\n${items}\n\nMy contact no. is (No. to be filled manually)\n\nand my total is ₹${grandTotal}.\n\nAnd i am completing the payment now, please prepare my order.`;

    window.open(`https://wa.me/916351189121?text=${encodeURIComponent(message)}`, '_blank');
  };

  const scrollToMenu = () => {
    document.getElementById('menu')?.scrollIntoView({behavior: 'smooth'});
  };

  const scrollToTop = () => {
    window.scrollTo({top: 0, behavior: 'smooth'});
  };

  const cartCount = cart.reduce((a, b) => a + b.quantity, 0);

  return (
    <div className="min-h-screen bg-brand-cream font-body text-gray-800 overflow-x-hidden selection:bg-orange-200 selection:text-orange-900">
      <Navbar 
        cartCount={cartCount} 
        onCartClick={() => setIsCartOpen(true)}
        onLogoClick={scrollToTop}
      />
      <Hero onOrderClick={scrollToMenu} />
      <About />
      <MenuSection 
        activeCategory={activeCategory} 
        setActiveCategory={setActiveCategory}
        onAddToCart={addToCart}
      />
      <ComboSection onAddToCart={addToCart} />
      <ContactSection />
      <Footer />

      <CartDrawer 
        isOpen={isCartOpen} 
        onClose={() => setIsCartOpen(false)}
        cart={cart}
        onUpdateQty={updateQuantity}
        onRemove={removeFromCart}
        itemTotal={itemTotal}
        deliveryFee={deliveryFee}
        grandTotal={grandTotal}
        location={location}
        onCheckout={checkout}
        onLocationClick={() => { setIsCartOpen(false); setTimeout(() => setShowLocationModal(true), 300); }}
      />

      {showLocationModal && (
        <LocationModal 
          onClose={() => setShowLocationModal(false)}
          onSelect={(loc) => { setLocation(loc); addToast(`Delivering to ${loc.name.split(',')[0]} ✓`); }}
        />
      )}

      <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-3 pointer-events-none">
        {toasts.map(t => (
          <div key={t.id} className="pointer-events-auto">
            <Toast message={t.message} onClose={() => setToasts(prev => prev.filter(x => x.id !== t.id))} />
          </div>
        ))}
      </div>

      {cart.length > 0 && !isCartOpen && (
        <FloatingCheckout 
          count={cartCount}
          total={grandTotal}
          onClick={() => setIsCartOpen(true)}
        />
      )}

      <a 
        href="https://wa.me/916351189121" 
        target="_blank"
        rel="noopener noreferrer"
        className="fixed bottom-28 right-5 w-14 h-14 bg-gradient-to-br from-green-400 to-green-600 text-white rounded-full shadow-2xl flex items-center justify-center text-2xl hover:scale-110 transition-transform z-30 ring-4 ring-white"
        title="Chat on WhatsApp"
      >
        💬
      </a>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
